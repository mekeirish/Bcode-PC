<!DOCTYPE html>

<head>
<meta charset="utf-8">

<title>Blocode</title>
<style>
/* Cyber glass : fond uni, verre translucide, filets cyan */
:root {
  --bg: #05070b; --text: #e9eef5; --dim: #8a94a6;
  --accent: #22d3ee; --ok: #34d399; --warn: #fbbf24; --err: #ff6b7a;
  --glass: rgba(255, 255, 255, .055); --glass2: rgba(255, 255, 255, .09); --edge: rgba(255, 255, 255, .13);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
html, body { height: 100%; margin: 0; color: var(--text); color-scheme: dark;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }

.glass { background: var(--glass); border: 1px solid var(--edge); border-top-color: rgba(34, 211, 238, .30); border-radius: 16px;
  -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 8px 28px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .08); }

/* ---------- Écran principal ---------- */
.app { min-height: 100vh; min-height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding: max(10px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom)); }
.main-col { display: contents; }
@media (min-width: 1024px) {
  .app {
    max-width: 1440px;
    min-height: 0;
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "header header"
      "side   main"
      "footer footer";
    column-gap: 14px;
    row-gap: 12px;
    padding: 14px;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  .app > header { grid-area: header; }
  .app > .side { grid-area: side; }
  .app > .main-col {
    grid-area: main;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow: auto;
    padding-right: 2px;
  }
  .app > footer { grid-area: footer; }
  .main-col > .code {
    flex: 1 1 auto;
    min-height: 200px;
    max-height: none;
  }
  .main-col > .row,
  .main-col > .grid { flex: 0 0 auto; }
  .main-col > #notifs { flex: 0 0 auto; }
}
/* ---------- Sidebar (desktop) ---------- */
.side {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  overflow: auto;
  min-height: 0;
}
@media (min-width: 1024px) {
  .side { display: flex; }
}
.side-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
  font-size: 14px;
  padding: 2px 2px 8px;
  border-bottom: 1px solid var(--edge);
}
.side-h b { color: var(--dim); font-weight: 500; font-size: 12px; }
.side-hint {
  color: var(--dim);
  font-size: 10.5px;
  font-weight: 400;
  opacity: .65;
  white-space: nowrap;
}
.side > input[type=search] { height: 36px; }
.side .chk { font-size: 12.5px; color: var(--dim); }
.side .row { margin: 2px 0 4px; gap: 6px; }
.side .sm { height: 34px; font-size: 12px; padding: 0 10px; }
.blist-side {
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: auto;
  min-height: 0;
  flex: 1 1 auto;
  padding-right: 2px;
}
.blist-side .card { margin: 0; padding: 8px 10px; }
.blist-side .card .nm { font-size: 12px; }
.blist-side .card .meta2 { margin: 2px 0 6px; font-size: 11px; }
.blist-side .sm { height: 30px; padding: 0 8px; font-size: 11.5px; }
.blist-side .empty { padding: 18px 8px; font-size: 12.5px; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 16px; }
.brand { flex: 1; font-weight: 700; font-size: 18px; letter-spacing: .6px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.code { flex: 1 1 auto; min-height: 130px; max-height: 46vh; max-height: 46dvh; display: flex; padding: 6px; }
#src { flex: 1; min-width: 0; height: auto; align-self: stretch; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
  font: 12px/1.5 var(--mono); padding: 8px; white-space: pre; overflow: auto; tab-size: 2; }
#src::placeholder { color: var(--dim); }
.meta { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; height: 44px; border-radius: 14px; font-size: 13px; color: var(--dim); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
.chip b:first-child { color: var(--warn); }
.chip b:nth-of-type(2) { color: var(--ok); }
.lvl { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; height: 44px; border-radius: 14px; font-size: 13px; color: var(--dim); }
.lvl select { flex: 1; min-width: 0; height: 36px; border: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600; outline: 0; }
.lvl select option { background: #12161f; }
.center { display: flex; justify-content: center; }
.center.first { margin-top: auto; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sig { text-align: center; font-size: 11px; letter-spacing: .5px; color: var(--dim); opacity: .55; padding: 2px 0 0; user-select: none; }

/* Boutons : verre, filet lumineux, retour au toucher */
.btn, .iconbtn, .sm { font: inherit; color: var(--text); cursor: pointer; background: var(--glass2); border: 1px solid var(--edge);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .10), 0 6px 18px rgba(0, 0, 0, .40);
  transition: transform .09s ease, border-color .15s, box-shadow .15s, background .15s;
  -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.btn:hover, .iconbtn:hover, .sm:hover { border-color: rgba(34, 211, 238, .55); }
.btn:active, .iconbtn:active, .sm:active { transform: translateY(1px) scale(.97); background: rgba(255, 255, 255, .15);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 0 0 1px rgba(34, 211, 238, .55), 0 0 18px rgba(34, 211, 238, .28); }
.btn { display: flex; align-items: center; justify-content: center; gap: 9px; height: 58px; padding: 0 14px; border-radius: 16px;
  font-weight: 600; font-size: 14.5px; line-height: 1.15; }
.btn.tbtn { flex-direction: column; gap: 5px; height: 62px; padding: 0 6px; font-size: 12.5px; }
.btn.cyan { background: rgba(34, 211, 238, .13); border-color: rgba(34, 211, 238, .45); color: #bdf4fc; }
.btn.green { background: rgba(52, 211, 153, .13); border-color: rgba(52, 211, 153, .42); color: #c2f5e0; }
.btn.hero { width: 78%; height: 60px; font-size: 15.5px; background: var(--accent); border-color: rgba(255, 255, 255, .28); color: #021014;
  box-shadow: 0 0 22px rgba(34, 211, 238, .34), inset 0 1px 0 rgba(255, 255, 255, .45); }
.btn.hero:hover { border-color: #fff; }
.btn.hero:active { background: #67e8f9; box-shadow: 0 0 30px rgba(34, 211, 238, .6), inset 0 1px 0 rgba(255, 255, 255, .3); }
.btn.small { height: 48px; font-size: 13.5px; border-radius: 14px; }
.btn:disabled, .iconbtn:disabled { opacity: .4; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; min-width: 44px; padding: 0 12px; border-radius: 14px;
  font-size: 13.5px; font-weight: 600; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#b-clear { color: #ff3b5c; }
#b-clear .ic { filter: drop-shadow(0 0 4px rgba(255, 59, 92, .65)); }
#b-copy-clean .ic { stroke: var(--ok); filter: drop-shadow(0 0 4px rgba(52, 211, 153, .65)); }
#b-test .ic { stroke: var(--warn); filter: drop-shadow(0 0 4px rgba(251, 191, 36, .65)); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.notif { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 6px 6px 6px 10px; border-radius: 12px;
  background: rgba(24, 27, 40, .78); border: 1px solid var(--edge); border-left: 3px solid var(--accent);
  -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .4); opacity: 0; transform: translateY(-6px) scale(.98); transition: .2s; }
/* ---------- Notifications (sous les boutons, au-dessus de la signature) ---------- */
#notifs { display: flex; flex-direction: column; gap: 6px; }
#notifs:empty { display: none; }
/* Test plein écran : les notifications repassent en haut de l'écran */
.app:has(.tpane.open.fullscreen) #notifs { position: fixed; z-index: 100; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  width: min(94vw, 540px); }
.notif.in { opacity: 1; transform: none; }
.notif.ok { border-left-color: var(--ok); } .notif.warn { border-left-color: var(--warn); } .notif.err { border-left-color: var(--err); }
.nmsg { flex: 1 1 120px; font-size: 13px; line-height: 1.25; word-break: break-word; }
.nact { display: flex; gap: 6px; flex-wrap: wrap; }
.nact button { height: 26px; padding: 0 9px; border-radius: 8px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  color: var(--text); background: rgba(255, 255, 255, .12); border: 1px solid var(--edge); }
.nx { width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--dim); font-size: 16px; line-height: 1; cursor: pointer; }

/* ---------- Feuilles (Avancé, bloc, test) ---------- */
.ov { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-end; justify-content: center;
  background: rgba(4, 5, 10, .55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ov.open { display: flex; }
.panel { width: 100%; max-width: 560px; max-height: 94vh; max-height: 94dvh; display: flex; flex-direction: column;
  border-radius: 26px 26px 0 0; background: rgba(14, 17, 25, .82); border: 1px solid var(--edge); border-bottom: 0;
  -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%);
  box-shadow: 0 -10px 50px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .12);
  padding-bottom: env(safe-area-inset-bottom); animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.ph { display: flex; align-items: center; gap: 8px; padding: 14px 14px 8px 18px; }
.ph h2 { flex: 1; margin: 0; font-size: 16px; word-break: break-all; }
.pb { overflow: auto; padding: 4px 12px 14px; -webkit-overflow-scrolling: touch; }

.acc { margin: 8px 0; border: 1px solid var(--edge); border-radius: 16px; background: rgba(255, 255, 255, .05); }
.acc > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; font-weight: 600; }
.acc > summary::-webkit-details-marker { display: none; }
.acc > summary::after { content: "▾"; color: var(--dim); }
.acc[open] > summary::after { content: "▴"; }
.acc > .in { padding: 0 12px 12px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
.row > * { flex: 1 1 auto; }
.ta { width: 100%; height: 30vh; min-height: 150px; resize: vertical; font: 12.5px/1.5 var(--mono); color: var(--text); background: rgba(0, 0, 0, .28);
  border: 1px solid var(--edge); border-radius: 12px; padding: 10px; white-space: pre; overflow: auto; }
input[type=search] { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(0, 0, 0, .25); color: var(--text); padding: 0 14px; font: inherit; }
label.chk { display: inline-flex; align-items: center; gap: 8px; color: var(--dim); font-size: 14px; flex: 0 0 auto; }
label.chk input { width: 18px; height: 18px; }
.note { background: rgba(0, 0, 0, .22); border: 1px solid var(--edge); border-radius: 12px; padding: 9px 12px; color: var(--dim); font-size: 13px; margin: 8px 0; }
.note.warn { border-color: var(--warn); color: var(--warn); } .note.err { border-color: var(--err); color: var(--err); } .note.okk { border-color: var(--ok); color: var(--ok); }
.status { color: var(--dim); font-size: 13px; margin: 8px 2px; }

.card { background: rgba(255, 255, 255, .06); border: 1px solid var(--edge); border-radius: 14px; padding: 10px 12px; margin: 8px 0; }
.card .nm { font: 600 13px var(--mono); word-break: break-all; }
.card .meta2 { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
.pick { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.pick input { width: 18px; height: 18px; flex: 0 0 auto; margin: 0; }
.chipc { display: inline-block; font: 11px var(--mono); padding: 1px 7px; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid var(--edge); margin-right: 6px; color: var(--dim); }
.chipc.js { color: #f7d774; } .chipc.css { color: #7fd1ff; } .chipc.html { color: #ff9b7a; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.sm { height: 38px; padding: 0 13px; border-radius: 11px; font-size: 13px; font-weight: 600; }
.sm.primary { background: var(--accent); color: #021014; border-color: rgba(255, 255, 255, .25); }
.sm.ok { background: rgba(52, 211, 153, .20); border-color: rgba(52, 211, 153, .5); }
.empty { color: var(--dim); text-align: center; padding: 26px 10px; font-size: 14px; }

.log details { background: rgba(255, 255, 255, .05); border: 1px solid var(--edge); border-radius: 12px; margin: 6px 0; }
.log summary { padding: 9px 12px; cursor: pointer; font-size: 14px; word-break: break-word; }
.log .bad > summary { color: var(--err); }
.log .w { color: var(--warn); font-size: 12.5px; display: block; margin-top: 2px; }
.diff { font: 12px/1.45 var(--mono); overflow-x: auto; border-top: 1px solid var(--edge); padding: 6px 0; }
.diff div { white-space: pre; padding: 0 10px; }
.d-add { background: rgba(74, 222, 157, .16); color: #b6f5d6; } .d-del { background: rgba(255, 122, 122, .16); color: #ffc4c4; }
.d-eq { color: var(--dim); } .d-gap { color: var(--dim); text-align: center; }
#tframe { width: 100%; height: 46vh; border: 1px solid var(--edge); border-radius: 12px; background: #fff; margin-top: 8px; }
.tpane { display: none; }
.tpane.open { display: block; }
/* Test en plein écran */
.tpane.open.fullscreen { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; border-radius: 0; background: var(--bg);
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
.tpane.open.fullscreen .pb { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.tpane.open.fullscreen #tframe { flex: 1; height: auto; min-height: 0; }
/* Test immersif : plein écran sans aucune bordure (comme dans la PWA réelle) */
.tpane.open.fullscreen.immersive { border: 0; border-radius: 0; box-shadow: none; padding: 0; background: #000;
  -webkit-backdrop-filter: none; backdrop-filter: none; }
.tpane.open.fullscreen.immersive .pb { padding: 0; }
.tpane.open.fullscreen.immersive #tframe { border: 0; border-radius: 0; margin-top: 0; }
.tpane.open.fullscreen.immersive #tstatus,
.tpane.open.fullscreen.immersive #terrs,
.tpane.open.fullscreen.immersive .row { display: none; }
.tpane.open.fullscreen.immersive .ph { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; z-index: 2; padding: 0; gap: 6px; }
.tpane.open.fullscreen.immersive .ph h2 { display: none; }
.tpane.open.fullscreen.immersive .ph .iconbtn { opacity: .35; height: 36px; min-width: 36px; padding: 0 8px; border-radius: 50%; }
.tpane.open.fullscreen.immersive .ph #t-fs { display: none; }
</style>

<div class="app">
  <header class="glass bar">
    <div class="brand">Bcode</div>
    <button class="iconbtn" id="b-undo-top" aria-label="Annuler la dernière action"><svg class="ic"><use href="#i-undo"/></svg></button>

<script>
/* ================================================================
   01 — Utilitaires + lexer JavaScript léger
   (gère chaînes, templates imbriqués, regex, commentaires)
   ================================================================ */
'use strict';

/* ---------- Marqueurs ---------- */
const MARK_SRC = '(?:\\/\\*|<!--)#(?:BLOC|FIN):[^\\s*<>]+?(?:\\*\\/|-->)';

/* Retire tous les marqueurs BLOC/FIN et restitue le texte d'origine à l'identique */
function stripMarks(text) {
  return text
    .replace(new RegExp('^[ \\t]*' + MARK_SRC + '[ \\t]*\\r?\\n', 'gm'), '')
    .replace(new RegExp(MARK_SRC, 'g'), '');
}

/* ---------- Noms ---------- */
function sanitizeName(s, max = 44) {
  s = String(s)
    .replace(/\s+/g, '_')
    .replace(/[^\p{L}\p{N}_$.:@%()+=,\[\]!?&|~^\-]/gu, '_')
    .replace(/_{2,}/g, '_')
    .replace(/-{2,}/g, '-');
  if (s.length > max) s = s.slice(0, max);
  s = s.replace(/^[_\-]+|[_\-.]+$/g, '');
  return s || 'x';
}

/* Rend les noms uniques (parcours dans l'ordre du document) : nom, nom#2, nom#3 … */
function uniqueNames(blocks) {
  const seen = new Map();
  (function walk(list) {
    for (const b of list) {
      const n = (seen.get(b.name) || 0) + 1;
      seen.set(b.name, n);
      if (n > 1) b.name = b.name + '#' + n;
      walk(b.children || []);
    }
  })(blocks);
}

/* ---------- Commentaires attachés au-dessus d'un bloc ----------
   Un commentaire sur sa propre ligne, collé au bloc (pas de ligne vide entre
   les deux), fait partie du bloc. Retourne la position de début. */
function attachLead(src, from, to, js) {
  const pieces = [];
  let i = from;
  while (i < to) {
    const c = src[i];
    if (/\s/.test(c)) {
      let j = i;
      while (j < to && /\s/.test(src[j])) j++;
      pieces.push({ t: 'ws', s: i, e: j });
      i = j;
    } else if (js && c === '/' && src[i + 1] === '/') {
      let j = i;
      while (j < to && src[j] !== '\n') j++;
      pieces.push({ t: 'com', s: i, e: j });
      i = j;
    } else if (c === '/' && src[i + 1] === '*') {
      const k = src.indexOf('*/', i + 2);
      const j = (k < 0 || k + 2 > to) ? to : k + 2;
      pieces.push({ t: 'com', s: i, e: j });
      i = j;
    } else {
      i++;
    }
  }
  let lead = to;
  for (let k = pieces.length - 1; k >= 0; k--) {
    const p = pieces[k];
    if (p.t === 'ws') {
      const nl = (src.slice(p.s, p.e).match(/\n/g) || []).length;
      if (nl > 1) break;
      continue;
    }
    const prev = pieces[k - 1];
    const own = prev && prev.t === 'ws' && src.slice(prev.s, prev.e).includes('\n');
    if (!own) break;
    lead = p.s;
  }
  return lead;
}

/* ---------- Lexer JS ---------- */
const KW_BEFORE_REGEX = new Set(['return', 'typeof', 'case', 'in', 'of', 'delete', 'void', 'throw', 'new', 'else', 'do', 'yield', 'await', 'instanceof']);
const RE_PUNCT = /=>|\.\.\.|\?\?=?|\?\.|\|\|=?|&&=?|\*\*=?|[=!]==?|<<=?|>>>?=?|\+\+|--|[-+*\/%&|^<>]=?|[?:.,;~!=@{}()\[\]]/y;
const RE_IDENT = /#?[\p{L}_$][\p{L}\p{N}_$‌‍]*/uy;
const RE_NUM = /\d[\w.]*/y;

function regexAllowed(prev) {
  if (!prev) return true;
  if (prev.t === 'p') return prev.v !== ')' && prev.v !== ']' && prev.v !== '}';
  if (prev.t === 'id') return KW_BEFORE_REGEX.has(prev.v);
  return false;
}

function scanRegex(src, i, end) {
  let j = i + 1, cls = false;
  while (j < end) {
    const c = src[j];
    if (c === '\n') return -1;
    if (c === '\\') { j += 2; continue; }
    if (c === '[') cls = true;
    else if (c === ']') cls = false;
    else if (c === '/' && !cls) {
      j++;
      while (j < end && /[a-z]/i.test(src[j])) j++;
      return j;
    }
    j++;
  }
  return -1;
}

function skipTemplate(src, i, end) {
  i++;
  while (i < end) {
    const c = src[i];
    if (c === '\\') { i += 2; continue; }
    if (c === '`') return i + 1;
    if (c === '$' && src[i + 1] === '{') { i = lex(src, i + 2, end, true).pos; continue; }
    i++;
  }
  return end;
}

/* Découpe src[i..end) en tokens. inTpl = on est dans un ${ … } : on s'arrête à l'accolade fermante. */
function lex(src, i, end, inTpl) {
  const toks = [];
  let depth = 0, prev = null;
  const push = (t, s, e, extra) => {
    e = Math.min(e, end);
    const k = Object.assign({ t, s, e }, extra);
    toks.push(k);
    if (t !== 'ws' && t !== 'com') prev = k;
    return k;
  };
  while (i < end) {
    const c = src[i], s = i;
    if (/\s/.test(c)) {
      let nl = false;
      while (i < end && /\s/.test(src[i])) { if (src[i] === '\n') nl = true; i++; }
      push('ws', s, i, { nl });
      continue;
    }
    if (c === '/' && src[i + 1] === '/') {
      while (i < end && src[i] !== '\n') i++;
      push('com', s, i, { nl: false });
      continue;
    }
    if (c === '/' && src[i + 1] === '*') {
      const j = src.indexOf('*/', i + 2);
      i = (j < 0 || j + 2 > end) ? end : j + 2;
      push('com', s, i, { nl: src.slice(s, i).includes('\n') });
      continue;
    }
    if (c === '"' || c === "'") {
      i++;
      while (i < end && src[i] !== c && src[i] !== '\n') { if (src[i] === '\\') i++; i++; }
      if (src[i] === c) i++;
      push('str', s, i);
      continue;
    }
    if (c === '`') {
      i = skipTemplate(src, i, end);
      push('tpl', s, i);
      continue;
    }
    if (c === '/' && regexAllowed(prev)) {
      const j = scanRegex(src, i, end);
      if (j > 0) { i = j; push('re', s, i); continue; }
    }
    RE_IDENT.lastIndex = i;
    let m = RE_IDENT.exec(src);
    if (m) { i += m[0].length; push('id', s, i, { v: m[0] }); continue; }
    if (c >= '0' && c <= '9') {
      RE_NUM.lastIndex = i;
      m = RE_NUM.exec(src);
      i += m ? m[0].length : 1;
      push('num', s, i);
      continue;
    }
    RE_PUNCT.lastIndex = i;
    m = RE_PUNCT.exec(src);
    const v = m ? m[0] : c;
    if (v === '{') depth++;
    else if (v === '}') {
      if (inTpl && depth === 0) return { toks, pos: i + 1 };
      depth--;
    }
    i += v.length;
    push('p', s, i, { v });
  }
  return { toks, pos: i };
}

/* Tokens significatifs + table d'appariement des (), [], {} */
function buildSig(toks) {
  const sig = [];
  let nl = false;
  for (const t of toks) {
    if (t.t === 'ws' || t.t === 'com') { if (t.nl) nl = true; continue; }
    sig.push(Object.assign({}, t, { nl }));
    nl = false;
  }
  const mt = new Int32Array(sig.length).fill(-1);
  const st = [];
  let stray = 0;
  sig.forEach((t, k) => {
    if (t.t !== 'p') return;
    if (t.v === '(' || t.v === '[' || t.v === '{') st.push(k);
    else if (t.v === ')' || t.v === ']' || t.v === '}') {
      const need = t.v === ')' ? '(' : t.v === ']' ? '[' : '{';
      let q = st.length - 1;
      while (q >= 0 && sig[st[q]].v !== need) q--;
      if (q >= 0) { const o = st[q]; st.length = q; mt[o] = k; mt[k] = o; }
      else stray++;
    }
  });
  return { sig, mt, unbalanced: st.length + stray };
}
/* ================================================================
   02 — Découpage du JavaScript en instructions / blocs
   ================================================================ */

const NO_END = new Set(['typeof', 'new', 'delete', 'void', 'in', 'instanceof', 'of', 'await', 'yield', 'extends', 'case', 'throw', 'else', 'do', 'return']);
const NO_START = new Set(['in', 'instanceof', 'of', 'else', 'catch', 'finally', 'extends', 'as', 'from']);
const CONTROL = new Set(['if', 'for', 'while', 'switch', 'try', 'do', 'with']);

function closeOf(ctx, k) {
  const m = ctx.mt[k];
  return m >= 0 ? m : ctx.sig.length - 1;
}

/* Le jeton précédent peut-il terminer une instruction ? */
function canEnd(t) {
  if (!t) return false;
  if (t.t === 'id') return !NO_END.has(t.v);
  if (t.t === 'num' || t.t === 'str' || t.t === 'tpl' || t.t === 're') return true;
  if (t.t === 'p') return t.v === ')' || t.v === ']' || t.v === '}' || t.v === '++' || t.v === '--';
  return false;
}

/* Le jeton suivant (sur une nouvelle ligne) peut-il commencer une instruction ?
   Règles JS : ( [ ` . + - etc. continuent l'instruction précédente. */
function canStart(t) {
  if (t.t === 'id') return !NO_START.has(t.v);
  if (t.t === 'num' || t.t === 'str') return true;
  if (t.t === 'p') return t.v === '{' || t.v === '!' || t.v === '~' || t.v === '++' || t.v === '--' || t.v === '@';
  return false;
}

/* Fin d'une instruction « simple » (expression, déclaration de variable…) */
function genericEnd(ctx, j, b) {
  const { sig } = ctx;
  let k = j;
  while (k < b) {
    const t = sig[k];
    if (t.t === 'p' && (t.v === '(' || t.v === '[' || t.v === '{')) k = closeOf(ctx, k) + 1;
    else if (t.t === 'p' && t.v === ';') return k + 1;
    else k++;
    if (k < b && sig[k].nl && canEnd(sig[k - 1]) && canStart(sig[k])) return k;
  }
  return Math.min(k, b);
}

/* Premier « { » de corps (fonction/classe) en sautant les groupes ( ) [ ] */
function bodyBrace(ctx, k, b) {
  const { sig } = ctx;
  while (k < b && !(sig[k].t === 'p' && sig[k].v === '{')) {
    if (sig[k].t === 'p' && (sig[k].v === '(' || sig[k].v === '[')) k = closeOf(ctx, k);
    k++;
  }
  return k < b ? k : -1;
}

/* Fin de l'instruction qui commence au jeton i (jetons < b) */
function stmtEnd(ctx, i, b) {
  const { sig } = ctx;
  let j = i;
  if (sig[j].t === 'id' && sig[j].v === 'export') {
    j++;
    if (sig[j] && sig[j].v === 'default') j++;
    if (j >= b) return b;
  }
  const u = sig[j];
  if (u.t === 'p' && u.v === '{') return Math.min(closeOf(ctx, j) + 1, b);
  if (u.t === 'p' && u.v === ';') return j + 1;
  if (u.t === 'id') {
    const v = u.v;
    if (v === 'if' || v === 'for' || v === 'while' || v === 'with') {
      let k = j + 1;
      if (sig[k] && sig[k].v === 'await') k++;
      if (sig[k] && sig[k].t === 'p' && sig[k].v === '(') k = closeOf(ctx, k) + 1;
      if (k >= b) return b;
      k = stmtEnd(ctx, k, b);
      if (v === 'if' && k < b && sig[k].t === 'id' && sig[k].v === 'else') k = k + 1 < b ? stmtEnd(ctx, k + 1, b) : b;
      return k;
    }
    if (v === 'switch') {
      let k = j + 1;
      if (sig[k] && sig[k].v === '(') k = closeOf(ctx, k) + 1;
      if (sig[k] && sig[k].v === '{') k = closeOf(ctx, k) + 1;
      return Math.min(k, b);
    }
    if (v === 'do') {
      let k = j + 1 < b ? stmtEnd(ctx, j + 1, b) : b;
      if (sig[k] && sig[k].v === 'while') {
        k++;
        if (sig[k] && sig[k].v === '(') k = closeOf(ctx, k) + 1;
        if (sig[k] && sig[k].v === ';') k++;
      }
      return Math.min(k, b);
    }
    if (v === 'try') {
      let k = j + 1;
      if (sig[k] && sig[k].v === '{') k = closeOf(ctx, k) + 1;
      if (sig[k] && sig[k].v === 'catch') {
        k++;
        if (sig[k] && sig[k].v === '(') k = closeOf(ctx, k) + 1;
        if (sig[k] && sig[k].v === '{') k = closeOf(ctx, k) + 1;
      }
      if (sig[k] && sig[k].v === 'finally') {
        k++;
        if (sig[k] && sig[k].v === '{') k = closeOf(ctx, k) + 1;
      }
      return Math.min(k, b);
    }
    const isAsyncFn = v === 'async' && sig[j + 1] && sig[j + 1].v === 'function';
    if (v === 'function' || isAsyncFn || v === 'class') {
      const o = bodyBrace(ctx, j + 1, b);
      if (o < 0) return b;
      return Math.min(closeOf(ctx, o) + 1, b);
    }
  }
  return genericEnd(ctx, j, b);
}

/* ---------- Analyse d'une instruction ---------- */

/* À partir du jeton m : fonction, fonction fléchée ou async ? */
function fnLike(ctx, m, j) {
  const { sig } = ctx;
  if (sig[m] && sig[m].v === 'async') m++;
  const t = sig[m];
  if (!t || m >= j) return false;
  if (t.t === 'id' && t.v === 'function') return true;
  if (t.t === 'id' && sig[m + 1] && sig[m + 1].v === '=>') return true;
  if (t.t === 'p' && t.v === '(') {
    const c = closeOf(ctx, m);
    return !!(sig[c + 1] && sig[c + 1].v === '=>');
  }
  return false;
}

/* Position du « = » d'une déclaration (const x = …) ou -1 */
function initIndex(ctx, k, j) {
  const { sig } = ctx;
  let m = k;
  if (sig[m] && sig[m].t === 'p' && (sig[m].v === '{' || sig[m].v === '[')) m = closeOf(ctx, m) + 1;
  else m++;
  return sig[m] && sig[m].t === 'p' && sig[m].v === '=' && m < j ? m : -1;
}

function declName(ctx, k) {
  const { sig } = ctx;
  const t = sig[k];
  if (!t) return 'x';
  if (t.t === 'id') return t.v;
  if (t.t === 'p' && (t.v === '{' || t.v === '[')) {
    const c = closeOf(ctx, k), ids = [];
    for (let m = k + 1; m < c && ids.length < 3; m++) {
      if (sig[m].t === 'id' && !(sig[m + 1] && sig[m + 1].v === ':')) ids.push(sig[m].v);
    }
    return ids.join('_') || 'destructuration';
  }
  return 'x';
}

function importName(ctx, k, j) {
  const { sig, src } = ctx;
  for (let m = j - 1; m > k; m--) {
    if (sig[m].t === 'str') return src.slice(sig[m].s + 1, sig[m].e - 1).split('/').pop() || 'module';
  }
  return 'module';
}

/* Nom/type d'une instruction-expression (appel, affectation, écouteur…) */
function exprInfo(ctx, k, j) {
  const { sig, src } = ctx;
  const t = sig[k];
  if (t.t === 'p' && t.v === '(') return { kind: 'iife', name: 'iife' };
  if (t.t === 'id' && CONTROL.has(t.v)) {
    let e = k + 1;
    if (sig[e] && sig[e].v === '(') e = closeOf(ctx, e) + 1;
    return { kind: 'code', name: src.slice(t.s, sig[Math.max(k, e - 1)].e).replace(/\s+/g, '') };
  }
  let m = k, path = '', lastName = '', lastArgs = -1, lastLit = '';
  while (m < j) {
    const x = sig[m];
    if (x.t === 'id' && (m === k || (sig[m - 1].t === 'p' && (sig[m - 1].v === '.' || sig[m - 1].v === '?.')))) { path += x.v; lastName = x.v; m++; }
    else if (x.t === 'p' && (x.v === '.' || x.v === '?.')) { path += '.'; m++; }

      lastLit = a1 && a1.t === 'str' ? src.slice(a1.s + 1, a1.e - 1) : '';

      m = c + 1;
    }
    else if (x.t === 'p' && x.v === '[') { path += '[]'; m = closeOf(ctx, m) + 1; }

  if (lastName === 'addEventListener' && lastArgs >= 0) {
    const target = path.replace(/\.addEventListener\([^)]*\)$/, '') || 'cible';
    return { kind: 'ev', name: (lastLit || 'evt') + ':' + target };

  if (sig[m] && sig[m].t === 'p' && sig[m].v === '=' && path) return { kind: 'assign', name: path };
  if (lastArgs >= 0 && path) return { kind: 'call', name: path };
  return { kind: 'code', name: src.slice(sig[k].s, sig[j - 1].e).replace(/\s+/g, '').slice(0, 28) };
}

/* Premier corps de fonction (=> { } ou function(){ }) dans l'instruction : enveloppe type IIFE / DOMContentLoaded */
function findWrapperBody(ctx, i, j) {
  const { sig } = ctx;
  for (let k = i; k < j; k++) {
    const t = sig[k];
    if (t.t !== 'p' || t.v !== '{') continue;
    const p = sig[k - 1];
    let ok = false;
    if (p && p.t === 'p' && p.v === '=>') ok = true;
    else if (p && p.t === 'p' && p.v === ')') {
      const o = ctx.mt[k - 1], bf = sig[o - 1];
      if (bf && (bf.v === 'function' || (bf.t === 'id' && sig[o - 2] && sig[o - 2].v === 'function') || bf.v === '*')) ok = true;
    }
    if (ok) return { open: k, close: closeOf(ctx, k) };
    k = closeOf(ctx, k);
  }
  return null;
}

function countLines(src, s, e) { return (src.slice(s, e).match(/\n/g) || []).length + 1; }

/* Membres d'une classe ou d'un objet littéral */
function membersOf(ctx, open, close, owner, level, mode) {
  const { sig, src } = ctx, out = [];
  let i = open + 1;
  while (i < close) {
    if (sig[i].t === 'p' && (sig[i].v === ';' || sig[i].v === ',')) { i++; continue; }
    const start = i;
    let k = i;
    while (k < close && sig[k].t === 'id' && ['static', 'async', 'get', 'set'].includes(sig[k].v) && sig[k + 1] &&

    if (sig[k] && sig[k].t === 'p' && sig[k].v === '*') k++;

      let m = k;
      while (m < close && !(sig[m].t === 'p' && sig[m].v === ',')) {

        m++;

    if (end > close) end = close;
    const s = attachLead(src, sig[start - 1].e, sig[start].s, true);
    const e = sig[end - 1].e;

      let kids = [];

  }

}

function describe(ctx, i, j, level) {
  const { sig, src } = ctx;
  const prevEnd = i > 0 ? sig[i - 1].e : ctx.a;
  const s = attachLead(src, prevEnd, sig[i].s, true);
  const e = sig[j - 1].e;

    if (v === 'async' && sig[k + 1] && sig[k + 1].v === 'function') { k2 = k + 1; v = 'function'; }
    if (v === 'function') {
      let m = k2 + 1;

      if (o >= 0) blk.children = membersOf(ctx, o, closeOf(ctx, o), name, level + 1, 'class');
    } else {
      let done = false;
      if (kind === 'const' || kind === 'let' || kind === 'var') {
        const eq = initIndex(ctx, k + 1, j);
        if (eq >= 0 && sig[eq + 1] && sig[eq + 1].t === 'p' && sig[eq + 1].v === '{') {
          const c = closeOf(ctx, eq + 1);
          if (c >= j - 2) { blk.children = membersOf(ctx, eq + 1, c, name, level + 1, 'object'); done = true; }
        }
      }
      if (!done && countLines(src, s, e) >= 8) {
        const w = findWrapperBody(ctx, k, j);
        if (w && countLines(src, sig[w.open].s, sig[w.close].e) >= 6) {
          blk.children = parseRange(ctx, w.open + 1, w.close, level + 1);
        }
      }
    }
  }
  /* Niveau 4 : le corps des fonctions est découpé en instructions */
  if (isFn && level < ctx.maxLevel && ctx.maxLevel >= 4) {
    const w = findWrapperBody(ctx, k, j);
    if (w && countLines(src, sig[w.open].s, sig[w.close].e) >= 6) {
      blk.children = parseRange(ctx, w.open + 1, w.close, level + 1);
    }
  }
  return blk;
}

/* Fusionne les instructions d'une seule ligne consécutives en une « zone » */
function mergeTiny(items, src, ctx) {
  const out = [];
  let run = [];
  const flush = () => {
    if (run.length > 1) {
      ctx.zn = (ctx.zn || 0) + 1;
      out.push({ s: run[0].s, e: run[run.length - 1].e, kind: 'zone', lang: 'js', name: 'zone:' + ctx.zn, children: [] });
    } else if (run.length === 1) out.push(run[0]);
    run = [];
  };
  for (const b of items) {
    const tiny = b.kind !== 'fn' && b.kind !== 'class' && !b.children.length && !src.slice(b.s, b.e).includes('\n');
    if (tiny) run.push(b);
    else { flush(); out.push(b); }
  }
  flush();
  return out;
}

function parseRange(ctx, from, to, level) {
  const items = [];
  let i = from;
  while (i < to) {
    if (ctx.sig[i].t === 'p' && ctx.sig[i].v === ';') { i++; continue; }
    let j = stmtEnd(ctx, i, to);
    if (j <= i) j = i + 1;
    if (j > to) j = to;
    items.push(describe(ctx, i, j, level));
    i = j;
  }
  return mergeTiny(items, ctx.src, ctx);

/* Point d'entrée : blocs JS de src[a..b) */
function jsBlocks(src, a, b, maxLevel) {
  const { toks } = lex(src, a, b, false);
  const B = buildSig(toks);
  const ctx = { src, sig: B.sig, mt: B.mt, a, maxLevel };
  return { blocks: parseRange(ctx, 0, B.sig.length, 1), unbalanced: B.unbalanced };

/* ================================================================
   03 — CSS, HTML, analyse globale et pose des marqueurs
   ================================================================ */

/* ---------- CSS ---------- */
function cssSkipStr(src, j, b) {
  const q = src[j];
  j++;
  while (j < b && src[j] !== q && src[j] !== '\n') { if (src[j] === '\\') j++; j++; }
  return j < b ? j + 1 : b;
}

function cssMatchBrace(src, open, b) {
  let d = 0, j = open;
  while (j < b) {
    const c = src[j];
    if (c === '/' && src[j + 1] === '*') { const k = src.indexOf('*/', j + 2); j = (k < 0 || k + 2 > b) ? b : k + 2; continue; }
    if (c === '"' || c === "'") { j = cssSkipStr(src, j, b); continue; }
    if (c === '{') d++;
    else if (c === '}') { d--; if (d === 0) return j; }
    j++;
  }
  return b - 1;
}

function cssBlocks(src, a, b, maxLevel, level) {
  level = level || 1;
  const out = [];
  let i = a, prevEnd = a;
  while (i < b) {
    while (i < b) {
      if (/\s/.test(src[i])) i++;
      else if (src[i] === '/' && src[i + 1] === '*') { const k = src.indexOf('*/', i + 2); i = (k < 0 || k + 2 > b) ? b : k + 2; }
      else break;
    }
    if (i >= b) break;
    const st = i;
    let j = i, open = -1;
    while (j < b) {
      const c = src[j];
      if (c === '/' && src[j + 1] === '*') { const k = src.indexOf('*/', j + 2); j = (k < 0 || k + 2 > b) ? b : k + 2; continue; }
      if (c === '"' || c === "'") { j = cssSkipStr(src, j, b); continue; }
      if (c === '(') {
        let d = 0;
        while (j < b) {
          const x = src[j];
          if (x === '"' || x === "'") { j = cssSkipStr(src, j, b); continue; }
          if (x === '(') d++;
          else if (x === ')') { d--; if (d === 0) { j++; break; } }
          j++;
        }
        continue;
      }
      if (c === '{') { open = j; break; }
      if (c === '}' || c === ';') { j++; break; }
      j++;
    }
    let e, prelude, cl = -1;
    if (open >= 0) { cl = cssMatchBrace(src, open, b); e = Math.min(cl + 1, b); prelude = src.slice(st, open); }
    else { e = j; prelude = src.slice(st, j); }
    prevEnd = e;
    const p = prelude.replace(/\s+/g, ' ').trim();
    if (!p || p === '}' || p === ';') { i = e; continue; }
    const blk = { s: attachLead(src, out.length ? out[out.length - 1].e : a, st, false), e, lang: 'css', kind: 'css', name: 'css:' + sanitizeName(p), children: [] };
    if (open >= 0 && level < maxLevel && /^@(media|supports|layer|container|scope)\b/i.test(p)) {
      blk.children = cssBlocks(src, open + 1, cl, maxLevel, level + 1);
    }
    out.push(blk);
    i = e;
  }
  return out;
}

/* ---------- HTML ---------- */
const VOID_TAGS = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'param', 'source', 'track', 'wbr']);
const RAW_TAGS = new Set(['script', 'style', 'textarea', 'title']);

function tagEnd(src, i) {
  let q = '';
  for (let j = i; j < src.length; j++) {
    const c = src[j];
    if (q) { if (c === q) q = ''; }
    else if (c === '"' || c === "'") q = c;
    else if (c === '>') return j;
  }
  return -1;
}

function parseHTML(src) {
  const root = { name: '#root', children: [] };
  const stack = [root], segs = [];
  let i = 0;
  while (i < src.length) {
    const lt = src.indexOf('<', i);
    if (lt < 0) break;
    if (src.startsWith('<!--', lt)) { const k = src.indexOf('-->', lt + 4); i = k < 0 ? src.length : k + 3; continue; }
    if (src[lt + 1] === '!' || src[lt + 1] === '?') { const k = src.indexOf('>', lt); i = k < 0 ? src.length : k + 1; continue; }
    if (src[lt + 1] === '/') {
      const m = /^<\/([a-zA-Z][\w:-]*)/.exec(src.slice(lt, lt + 60));
      const k = src.indexOf('>', lt);
      const endPos = k < 0 ? src.length : k + 1;
      if (m) {
        const nm = m[1].toLowerCase();
        let q = stack.length - 1;
        while (q > 0 && stack[q].name !== nm) q--;
        if (q > 0) {
          while (stack.length > q + 1) stack.pop().e = lt;
          stack.pop().e = endPos;
        }
      }
      i = endPos;
      continue;
    }
    const m = /^<([a-zA-Z][\w:-]*)/.exec(src.slice(lt, lt + 60));
    if (!m) { i = lt + 1; continue; }
    const nm = m[1].toLowerCase();
    const te = tagEnd(src, lt);
    if (te < 0) break;
    const raw = src.slice(lt, te + 1);
    const node = { name: nm, s: lt, e: te + 1, attrs: raw.slice(m[0].length, -1), children: [] };
    const selfClose = /\/\s*>$/.test(raw) || VOID_TAGS.has(nm);
    stack[stack.length - 1].children.push(node);
    if (RAW_TAGS.has(nm) && !selfClose) {
      const re = new RegExp('</' + nm + '\\s*>', 'ig');
      re.lastIndex = te + 1;
      const cm = re.exec(src);
      const cs = te + 1, ce = cm ? cm.index : src.length;
      node.e = cm ? cm.index + cm[0].length : src.length;
      const ty = (/\btype\s*=\s*["']?([^"'\s>]+)/i.exec(node.attrs) || [])[1];
      const t = ty ? ty.toLowerCase() : '';

        segs.push({ type: 'js', a: cs, b: ce });
      if (nm === 'style' && (!t || t === 'text/css') && src.slice(cs, ce).trim())
        segs.push({ type: 'css', a: cs, b: ce });
      i = node.e;
      continue;
    }
    if (!selfClose) stack.push(node);
    i = te + 1;
  }
  while (stack.length > 1) stack.pop().e = src.length;
  return { root, segs };
}

function htmlBlocks(root, src, maxLevel) {
  const out = [];
  const isSS = n => n.name === 'script' || n.name === 'style';
  const attr = (n, k) => (new RegExp('\\b' + k + '\\s*=\\s*["\']?([^"\'\\s>]+)', 'i').exec(n.attrs || '') || [])[1];
  function mk(n, level) {
    const id = attr(n, 'id'), cls = attr(n, 'class');
    const label = id || (n.name + (cls ? '.' + cls.split(/[,\s]/)[0] : ''));
    const blk = { s: n.s, e: n.e, lang: 'html', kind: 'html', name: 'html:' + sanitizeName(label), children: [] };
    if (level < maxLevel) {
      for (const c of n.children) {
        if (isSS(c)) continue;
        if (attr(c, 'id') || countLines(src, c.s, c.e) >= 3) blk.children.push(mk(c, level + 1));
      }
    }
    return blk;
  }
  function headRuns(children) {
    let run = [];
    const flush = () => {
      if (run.length) out.push({ s: run[0].s, e: run[run.length - 1].e, lang: 'html', kind: 'html', name: 'html:head', children: [] });
      run = [];
    };
    for (const c of children) { if (isSS(c)) flush(); else run.push(c); }
    flush();
  }
  (function top(nodes) {
    for (const n of nodes) {
      if (n.name === 'html' || n.name === 'body') top(n.children);
      else if (n.name === 'head') headRuns(n.children);
      else if (!isSS(n)) out.push(mk(n, 1));
    }
  })(root.children);
  return out;
}

/* ---------- Analyse globale ---------- */
function flatten(list, acc) {
  for (const b of list) { acc.push(b); flatten(b.children || [], acc); b.children = []; }
  return acc;
}

function mkMark(kind, name, lang) {
  return lang === 'html' ? '<!--#' + kind + ':' + name + '-->' : '/*#' + kind + ':' + name + '*/';
}

function insertMarks(src, flat) {
  const eol = src.includes('\r\n') ? '\r\n' : '\n';
  const ops = [];
  flat.forEach((b, ord) => {
    const ls = src.lastIndexOf('\n', b.s - 1) + 1;
    const prefix = src.slice(ls, b.s);
    const indent = /^[ \t]*/.exec(src.slice(ls))[0];
    const aloneB = /^[ \t]*$/.test(prefix);
    ops.push({ pos: aloneB ? ls : b.s, k: 1, ord, text: aloneB ? prefix + mkMark('BLOC', b.name, b.lang) + eol : mkMark('BLOC', b.name, b.lang) });
    const le = src.indexOf('\n', b.e);
    const aloneF = le >= 0 && /^[ \t]*\r?$/.test(src.slice(b.e, le));
    ops.push({ pos: aloneF ? le + 1 : b.e, k: 0, ord, text: aloneF ? indent + mkMark('FIN', b.name, b.lang) + eol : mkMark('FIN', b.name, b.lang) });
  });
  ops.sort((x, y) => x.pos - y.pos || x.k - y.k || (x.k === 0 ? y.ord - x.ord : x.ord - y.ord));
  let out = '', last = 0;
  for (const o of ops) { out += src.slice(last, o.pos) + o.text; last = o.pos; }
  return out + src.slice(last);
}

/* Analyse un code HTML complet et renvoie { text (balisé), blocks, warnings } */
function analyze(srcRaw, opt) {
  const maxLevel = (opt && opt.level) || 2;
  const src = stripMarks(srcRaw);
  const warnings = [];
  if (src !== srcRaw && parseMarks(srcRaw).errors.length)
    warnings.push('Le code contenait des marqueurs incohérents ou du texte ressemblant à des marqueurs : ils ont été retirés avant l\'analyse.');
  const { root, segs } = parseHTML(src);
  let all = htmlBlocks(root, src, maxLevel);
  let n = 0;
  for (const sg of segs) {
    n++;
    if (sg.type === 'js') {
      const r = jsBlocks(src, sg.a, sg.b, maxLevel);
      if (r.unbalanced) warnings.push('Script n°' + n + ' : parenthèses/accolades non équilibrées (' + r.unbalanced + ') — découpage approximatif.');
      all = all.concat(r.blocks);
    } else {
      all = all.concat(cssBlocks(src, sg.a, sg.b, maxLevel, 1));
    }
  }
  let flat = flatten(all, []);
  flat.sort((x, y) => x.s - y.s || y.e - x.e);
  /* Vérifie l'imbrication (aucun chevauchement partiel) */
  const ok = [], stack = [];
  for (const b of flat) {
    while (stack.length && b.s >= stack[stack.length - 1].e) stack.pop();
    if (stack.length && b.e > stack[stack.length - 1].e) { warnings.push('Bloc ignoré (chevauchement) : ' + b.name); continue; }
    ok.push(b); stack.push(b);
  }
  flat = ok;
  uniqueNames(flat);
  const text = insertMarks(src, flat);
  if (stripMarks(text) !== src) {
    warnings.push('Erreur interne : le retrait des marqueurs ne redonne pas le code d\'origine. Code renvoyé sans marqueurs.');
    return { text: src, blocks: [], warnings };
  }
  return { text, blocks: flat, warnings };
}
/* ================================================================
   04 — Lecture des marqueurs, application des remplacements,
        diff, validation, prompt, index
   ================================================================ */

const RE_AFTER = /[ \t]*(\r?\n|$)/y;

/* Géométrie d'un marqueur trouvé à l'index idx (longueur len) */
function markGeom(text, idx, len) {
  const ls = text.lastIndexOf('\n', idx - 1) + 1;
  const before = /^[ \t]*$/.test(text.slice(ls, idx));
  RE_AFTER.lastIndex = idx + len;
  const after = RE_AFTER.exec(text);
  const alone = before && !!after;
  return {
    alone, ls,
    outerS: alone ? ls : idx,
    outerE: alone ? idx + len + after[0].length : idx + len
  };
}

/* ---------- Lire les blocs d'un texte balisé ---------- */
function parseMarks(text) {
  const re = /(?:\/\*|<!--)#(BLOC|FIN):([^\s*<>]+?)(?:\*\/|-->)/g;
  const blocks = [], stack = [], errors = [];
  let m;
  while ((m = re.exec(text))) {
    const g = markGeom(text, m.index, m[0].length);
    if (m[1] === 'BLOC') {
      const b = {
        name: m[2], depth: stack.length, closed: false,
        html: m[0].startsWith('<!--'), markStart: m.index,
        outerStart: g.outerS, innerStart: g.alone ? g.outerE : m.index + m[0].length
      };
      blocks.push(b);
      stack.push(b);
    } else {
      let q = stack.length - 1;
      while (q >= 0 && stack[q].name !== m[2]) q--;
      if (q < 0) { errors.push('FIN sans BLOC : ' + m[2]); continue; }
      for (let k = stack.length - 1; k > q; k--) errors.push('BLOC non fermé : ' + stack[k].name);
      const b = stack[q];
      stack.length = q;
      b.closed = true;
      b.innerEnd = g.alone ? g.ls : m.index;
      b.outerEnd = g.outerE;
    }
  }
  stack.forEach(b => errors.push('BLOC non fermé : ' + b.name));
  const done = blocks.filter(b => b.closed);
  for (const b of done) {
    const inner = text.slice(b.innerStart, b.innerEnd);
    b.lines = inner.trim() ? (inner.match(/\n/g) || []).length + (inner.endsWith('\n') ? 0 : 1) : 0;
    b.lang = b.name.startsWith('css:') ? 'css' : b.name.startsWith('html:') ? 'html' : 'js';
  }
  return { blocks: done, errors };
}

/* Retrouve un bloc par son nom (tolère l'oubli du préfixe ou la casse) */
function findBlock(blocks, name) {
  let b = blocks.find(x => x.name === name);
  if (b) return { block: b, exact: true };
  const bare = n => n.includes(':') ? n.slice(n.indexOf(':') + 1) : n;
  let c = blocks.filter(x => bare(x.name) === name || bare(x.name) === bare(name));
  if (c.length === 1) return { block: c[0], exact: false };
  c = blocks.filter(x => x.name.toLowerCase() === name.toLowerCase());
  if (c.length === 1) return { block: c[0], exact: false };
  return null;
}

/* ---------- Lire la réponse de l'IA ---------- */
function parseResponse(resp) {
  const re = /(?:\/\*|<!--)#(BLOC|FIN|APRES|AVANT|SUPPRIMER):([^\s*<>]+?)(?:\*\/|-->)/g;
  const ops = [], errors = [], stack = [];
  let m, pending = null;
  while ((m = re.exec(resp))) {
    const type = m[1], name = m[2];
    const g = markGeom(resp, m.index, m[0].length);
    if (type === 'APRES' || type === 'AVANT') { pending = { mode: type, ref: name }; continue; }
    if (type === 'SUPPRIMER') { ops.push({ op: 'delete', name }); continue; }
    if (type === 'BLOC') { stack.push({ name, outerS: g.outerS }); continue; }
    let q = stack.length - 1;
    while (q >= 0 && stack[q].name !== name) q--;
    if (q < 0) { errors.push('FIN sans BLOC : ' + name); continue; }
    const top = stack[q];
    stack.length = q;
    if (q === 0) {
      const text = resp.slice(top.outerS, g.outerE);
      if (pending) {
        ops.push({ op: pending.mode === 'APRES' ? 'after' : 'before', ref: pending.ref, name, text });
        pending = null;
      } else ops.push({ op: 'replace', name, text });
    }
  }
  stack.forEach(s => errors.push('BLOC non fermé dans la réponse : ' + s.name));
  if (pending) errors.push('#' + pending.mode + ':' + pending.ref + ' sans bloc à insérer');
  return { ops, errors };
}

/* Réécrit le premier #BLOC et le dernier #FIN d'un texte (nom + style de commentaire) */
function normalizeOuter(nt, name, html) {
  const re = /(?:\/\*|<!--)#(BLOC|FIN):([^\s*<>]+?)(?:\*\/|-->)/g;
  let first = null, last = null, m;
  while ((m = re.exec(nt))) {
    if (m[1] === 'BLOC' && !first) first = { i: m.index, l: m[0].length };
    if (m[1] === 'FIN') last = { i: m.index, l: m[0].length };
  }
  if (!first || !last) return nt;
  const lang = html ? 'html' : 'js';
  return nt.slice(0, first.i) + mkMark('BLOC', name, lang) + nt.slice(first.i + first.l, last.i) +
    mkMark('FIN', name, lang) + nt.slice(last.i + last.l);
}

function fixEnds(nt, region) {
  const rEnd = /\n$/.test(region), nEnd = /\n$/.test(nt);
  if (rEnd && !nEnd) return nt + (/\r\n/.test(region) ? '\r\n' : '\n');
  if (!rEnd && nEnd) return nt.replace(/\r?\n$/, '');
  return nt;
}

/* ---------- Appliquer une liste d'opérations ---------- */
function applyOps(state, ops) {
  let text = state;
  const eol = text.includes('\r\n') ? '\r\n' : '\n';
  const log = [];
  let lastAdded = null;
  for (let o of ops) {
    const { blocks } = parseMarks(text);
    /* Plusieurs blocs à la suite d'un seul #APRES / #AVANT : un « remplacement » dont le nom
       n'existe pas, juste après une insertion, est inséré après le bloc précédemment ajouté */
    const prevAdded = lastAdded;
    lastAdded = null;
    if (o.op === 'replace' && prevAdded && !findBlock(blocks, o.name)) {
      o = { op: 'after', ref: prevAdded, name: o.name, text: o.text };
    }
    const refName = (o.op === 'after' || o.op === 'before') ? o.ref : o.name;
    const hit = findBlock(blocks, refName);
    if (!hit) {
      const bare = refName.includes(':') ? refName.split(':').pop() : refName;
      const near = blocks.filter(b => b.name.toLowerCase().includes(bare.toLowerCase())).slice(0, 3).map(b => b.name);
      log.push({ ok: false, name: refName, msg: 'Bloc introuvable : ' + refName + (near.length ? ' (proche : ' + near.join(', ') + ')' : '') });
      continue;
    }
    const b = hit.block;
    const region = text.slice(b.outerStart, b.outerEnd);
    if (o.op === 'delete') {
      text = text.slice(0, b.outerStart) + text.slice(b.outerEnd);
      log.push({ ok: true, name: b.name, msg: 'Supprimé : ' + b.name, oldText: stripMarks(region), newText: '' });
      continue;
    }
    let nt = o.text.replace(/\r?\n/g, eol);
    if (o.op === 'replace') {
      nt = normalizeOuter(nt, b.name, b.html);
      nt = fixEnds(nt, region);
      text = text.slice(0, b.outerStart) + nt + text.slice(b.outerEnd);
      const warn = [checkCode(b.lang, stripMarks(nt)), lostSubs(region, nt)].filter(Boolean).join(' · ') || null;
      log.push({ ok: true, name: b.name, msg: 'Remplacé : ' + b.name + (hit.exact ? '' : ' (nom « ' + o.name + ' » corrigé)'), warn, oldText: stripMarks(region), newText: stripMarks(nt) });
    } else {
      const nm = o.name;
      const dup = blocks.find(x => x.name === nm);
      if (dup) {
        /* Nom déjà pris : jamais de renommage silencieux (l'IA ne le saurait pas) */
        if (stripMarks(text.slice(dup.outerStart, dup.outerEnd)).trim() === stripMarks(nt).trim()) {
          lastAdded = nm;
          log.push({ ok: true, name: nm, msg: 'Déjà présent (identique, ignoré) : ' + nm });
        } else {
          log.push({ ok: false, name: nm, msg: 'Ajout refusé : « ' + nm + ' » existe déjà. Pour le modifier, renvoyer le bloc sans #APRES / #AVANT' });
        }
        continue;
      }
      nt = normalizeOuter(nt, nm, b.html);
      if (!/\n$/.test(nt)) nt += eol;
      if (o.op === 'after') {
        const pre = /\n$/.test(region) ? '' : eol;
        text = text.slice(0, b.outerEnd) + pre + nt + text.slice(b.outerEnd);
      } else {
        text = text.slice(0, b.outerStart) + nt + text.slice(b.outerStart);
      }
      lastAdded = nm;
      const lang = nm.startsWith('css:') ? 'css' : nm.startsWith('html:') ? 'html' : 'js';
      const warn = [/^[A-Za-z]+:/.test(nm) ? null : 'nom sans préfixe (fn:, css:, html:, const:…)', checkCode(lang, stripMarks(nt))].filter(Boolean).join(' · ') || null;
      log.push({ ok: true, name: nm, msg: 'Ajouté ' + (o.op === 'after' ? 'après ' : 'avant ') + b.name + ' : ' + nm, warn, oldText: '', newText: stripMarks(nt) });
    }
  }
  return { text, log };
}

/* Remplacer un bloc par du code brut (sans marqueurs) collé à la main */
function replaceBlockRaw(state, name, code) {
  const { blocks } = parseMarks(state);
  const hit = findBlock(blocks, name);
  if (!hit) return { text: state, log: [{ ok: false, name, msg: 'Bloc introuvable : ' + name }] };
  const b = hit.block;
  const eol = state.includes('\r\n') ? '\r\n' : '\n';
  const ls = state.lastIndexOf('\n', b.markStart - 1) + 1;
  const indent = /^[ \t]*/.exec(state.slice(ls))[0];
  const lang = b.html ? 'html' : 'js';
  const body = code.replace(/\r?\n/g, eol).replace(/^(?:[ \t]*\r?\n)+/, '').replace(/(?:\r?\n[ \t]*)+$/, '');
  const nt = indent + mkMark('BLOC', b.name, lang) + eol + body + eol + indent + mkMark('FIN', b.name, lang) + eol;
  return applyOps(state, [{ op: 'replace', name: b.name, text: nt }]);
}

/* ---------- Diff par lignes ---------- */
function diffLines(a, b) {
  const A = a.split('\n'), B = b.split('\n');
  let s = 0;
  while (s < A.length && s < B.length && A[s] === B[s]) s++;
  let ea = A.length, eb = B.length;
  while (ea > s && eb > s && A[ea - 1] === B[eb - 1]) { ea--; eb--; }
  const a2 = A.slice(s, ea), b2 = B.slice(s, eb), out = [];
  for (let i = 0; i < s; i++) out.push({ t: '=', l: A[i] });
  const n = a2.length, m = b2.length;
  if (n * m <= 3e6) {
    const w = m + 1, dp = new Uint32Array((n + 1) * w);
    for (let i = n - 1; i >= 0; i--)
      for (let j = m - 1; j >= 0; j--)
        dp[i * w + j] = a2[i] === b2[j] ? dp[(i + 1) * w + j + 1] + 1 : Math.max(dp[(i + 1) * w + j], dp[i * w + j + 1]);
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a2[i] === b2[j]) { out.push({ t: '=', l: a2[i] }); i++; j++; }
      else if (dp[(i + 1) * w + j] >= dp[i * w + j + 1]) out.push({ t: '-', l: a2[i++] });
      else out.push({ t: '+', l: b2[j++] });
    }
    while (i < n) out.push({ t: '-', l: a2[i++] });
    while (j < m) out.push({ t: '+', l: b2[j++] });
  } else {
    a2.forEach(l => out.push({ t: '-', l }));
    b2.forEach(l => out.push({ t: '+', l }));
  }
  for (let i = ea; i < A.length; i++) out.push({ t: '=', l: A[i] });
  return out;
}

/* ---------- Validation (renvoie null si OK, sinon un message) ---------- */
function checkCode(lang, code) {
  if (lang === 'css') {
    let d = 0;
    for (let j = 0; j < code.length; j++) {
      const c = code[j];
      if (c === '/' && code[j + 1] === '*') { const k = code.indexOf('*/', j + 2); j = k < 0 ? code.length : k + 1; }
      else if (c === '"' || c === "'") j = cssSkipStr(code, j, code.length) - 1;
      else if (c === '{') d++;
      else if (c === '}') d--;
    }
    return d === 0 ? null : 'Accolades CSS non équilibrées (' + (d > 0 ? d + ' « { » en trop' : -d + ' « } » en trop') + ')';
  }
  if (lang !== 'js') return null;
  const B = buildSig(lex(code, 0, code.length, false).toks);
  if (B.unbalanced) return 'Parenthèses/accolades JS non équilibrées (' + B.unbalanced + ')';
  if (/^\s*import\s/m.test(code)) return null;
  const c = code.replace(/^(\s*)export\s+default\s+/m, '$1').replace(/^(\s*)export\s+/gm, '$1');
  const wraps = [c, 'class __C {\n' + c + '\n}', '({\n' + c + '\n})', 'async function __f() {\n' + c + '\n}'];
  let first = null;
  for (const w of wraps) {
    try { new Function(w); return null; } catch (e) { if (!first) first = e; }
  }
  return 'Syntaxe JS douteuse : ' + (first && first.message);
}
/* Sous-blocs présents dans l'ancien bloc mais absents du nouveau */
function lostSubs(oldText, newText) {
  const names = t => parseMarks(t).blocks.filter(b => b.depth > 0).map(b => b.name);
  const has = new Set(names(newText));
  const miss = names(oldText).filter(n => !has.has(n));
  return miss.length ? 'Sous-blocs absents de la réponse : ' + miss.slice(0, 5).join(', ') + (miss.length > 5 ? ' …' : '') : null;
}
/* Vérification du document entier : doublons de déclarations et syntaxe de chaque script */
function checkGlobal(text) {
  const out = [];
  const seen = new Set();
  parseMarks(text).blocks.forEach(b => {
    const m = /^(fn|class|const|let|var):(.+)#\d+$/.exec(b.name);
    if (m && !seen.has(m[1] + ':' + m[2])) {
      seen.add(m[1] + ':' + m[2]);
      out.push('Doublon probable : « ' + m[2] + ' » semble déclaré plusieurs fois (' + b.name + ')');
    }
  });
  const src = stripMarks(text);
  let n = 0;
  for (const sg of parseHTML(src).segs) {
    if (sg.type !== 'js') continue;
    n++;
    const code = src.slice(sg.a, sg.b);
    if (/^\s*(import|export)\s/m.test(code)) continue;
    try { new Function(code); } catch (e) { out.push('Script JS n°' + n + ' : ' + e.message); }
  }
  return out;
}

/* ---------- Prompt et index ---------- */
const PROMPT_TEXT = `Nous travaillons avec la MÉTHODE PAR BLOCS sur un projet HTML monolithique (HTML + CSS + JS dans un seul fichier).

Le code que je te donne est découpé en blocs délimités par des marqueurs en commentaires :
  JS / CSS : /*\u0023BLOC:nom*/ … /*\u0023FIN:nom*/
  HTML     : <!--\u0023BLOC:nom--> … <!--\u0023FIN:nom-->
Les blocs peuvent être imbriqués (ex. les méthodes d'une classe). Chaque nom est unique (ex. fn:render, class:App, method:App.render, css:.btn, html:app, zone:1).
Les marqueurs sont des commentaires : le code reste valide et exécutable tel quel.

RÈGLES DE RÉPONSE (strictes) :
1. Ne me renvoie JAMAIS le fichier complet. Renvoie uniquement les blocs que tu modifies ou ajoutes.
2. Chaque bloc renvoyé est COMPLET : du marqueur #BLOC jusqu'au marqueur #FIN, avec exactement le même nom. Jamais de « … », ni de « reste inchangé », ni de code abrégé.
3. Si un bloc contient des sous-blocs, conserve-les avec leurs marqueurs. Si un seul sous-bloc change, renvoie seulement ce sous-bloc.
4. Pour AJOUTER un bloc : écris d'abord /*\u0023APRES:nom-existant*/ (ou /*\u0023AVANT:nom-existant*/), puis le nouveau bloc complet avec ses marqueurs #BLOC/#FIN. Il est inséré à côté du bloc cité, au même niveau, jamais à l'intérieur ; pour ajouter dans un bloc sans sous-blocs, remplace-le. Le nom du nouveau bloc est inédit (absent de l'index) et préfixé comme le reste du code : fn:, css:, html:, const:, method:Classe.nom… Une déclaration = un bloc. Pour ajouter plusieurs blocs, mets un #APRES avant chacun (le suivant s'ancre sur le bloc que tu viens d'ajouter).
5. Pour SUPPRIMER un bloc : /*\u0023SUPPRIMER:nom*/
6. Ne renomme jamais un bloc existant et ne modifie pas ses marqueurs. Pour modifier un bloc, repars toujours de sa dernière version connue (ta dernière réponse ou ma dernière mise à jour), jamais de la version initiale.
7. Ne change rien d'autre que ce que je demande : pas de refactorisation, pas de renommage, pas d'amélioration non demandée.
8. Garde un code lisible et bien indenté (jamais minifié).
9. Mets TOUS les blocs de ta réponse à la suite dans UN SEUL bloc de code, clôturé par 4 backticks (\`\`\`\`), même si tu mélanges HTML, CSS et JS : jamais un bloc de code par langage ni par bloc, et aucun texte entre les blocs. Une courte phrase avant ou après suffit.
10. Si le bloc à modifier n'est pas dans ce que je t'ai envoyé, demande-le-moi par son nom.

Je vais maintenant donner le code balisé. Réponds simplement « Prêt », puis attends ma demande.`;

function buildIndex(text) {
  const { blocks } = parseMarks(text);
  return 'INDEX DES BLOCS (nom — nombre de lignes) :\n' +
    blocks.map(b => '  '.repeat(b.depth) + b.name + ' — ' + b.lines + ' l.').join('\n');
}

   05 — Interface (écran unique, feuille « Avancé », notifications flottantes)
   ================================================================ */

const $ = id => document.getElementById(id);
const STORE_KEY = 'blocs.v1';
const MAX_HIST = 30;
let hist = [];
let dlgMode = null, dlgName = null, lastMarkErr = '';
/* ---------- État historique (IndexedDB) et sélection de blocs ---------- */
let idbOK = true, lastHistSig = '', idbP = null;
const picked = new Set();
/* ---------- Ce que l'IA connaît : empreinte du contenu propre de chaque bloc ---------- */
const SNAP_KEY = 'blocs.snap';
let aiSnap = {};
try { aiSnap = JSON.parse(localStorage.getItem(SNAP_KEY) || '{}') || {}; } catch (e) { /* stockage indisponible */ }
/* Empreinte rapide (FNV-1a 32 bits + longueur) */
function hashStr(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return (h >>> 0).toString(36) + s.length.toString(36);
}
/* Empreinte du contenu propre d'un bloc (sans ses sous-blocs, pour ne pas renvoyer un parent entier) */
function ownHash(text, b, all) {
  let out = '', pos = b.outerStart;
  all.forEach(c => {
    if (c.depth === b.depth + 1 && c.outerStart >= b.outerStart && c.outerEnd <= b.outerEnd) {
      out += text.slice(pos, c.outerStart);
      pos = c.outerEnd;
    }
  });
  return hashStr(stripMarks(out + text.slice(pos, b.outerEnd)));
}
function saveSnap() {
  try { localStorage.setItem(SNAP_KEY, JSON.stringify(aiSnap)); } catch (e) { /* quota */ }
}
/* Enregistre ce que l'IA connaît. Sans names : tout le code (nouvel envoi complet, on repart de zéro).
   Avec names : seulement ces blocs et leurs sous-blocs. */
function snapMark(text, names) {
  const A = parseMarks(text).blocks;
  const roots = names ? A.filter(x => names.includes(x.name)) : null;
  if (!names) aiSnap = {};
  A.forEach(b => {
    if (!roots || roots.some(t => t.outerStart <= b.outerStart && b.outerEnd <= t.outerEnd)) aiSnap[b.name] = ownHash(text, b, A);
  });
  saveSnap();
}
/* Après application d'une réponse : l'IA connaît les blocs qu'elle a écrits ; ceux qui ont disparu sont oubliés */
function snapApply(before, after, names) {
  const now = new Set(parseMarks(after).blocks.map(b => b.name));
  parseMarks(before).blocks.forEach(b => { if (!now.has(b.name)) delete aiSnap[b.name]; });
  snapMark(after, names);
}
/* Blocs modifiés ou ajoutés depuis ce que l'IA connaît, et blocs disparus */
function changedBlocks(text) {
  const A = parseMarks(text).blocks;
  const have = new Set(A.map(b => b.name));
  const changed = A.filter(b => aiSnap[b.name] !== ownHash(text, b, A));
  const gone = Object.keys(aiSnap).filter(n => !have.has(n));
  return { changed, gone };
}
function idbDb() {
  if (!idbP) idbP = new Promise((res, rej) => {
    if (!window.indexedDB) { rej(new Error('IndexedDB indisponible')); return; }
    const r = indexedDB.open('blocs-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return idbP;
}
function idbGet(key) {
  return idbDb().then(db => new Promise((res, rej) => {
    const q = db.transaction('kv').objectStore('kv').get(key);
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  }));
}
function idbSet(key, val) {
  return idbDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
function histSig() {
  return hist.length + ':' + (hist.length ? hist[hist.length - 1].t : 0);
}
/* Secours si IndexedDB est indisponible : ancien stockage localStorage (historique réduit si quota dépassé) */
function saveLegacy(data) {
  let h = hist.slice(-MAX_HIST);
  for (;;) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(Object.assign({ hist: h }, data)));
      hist = h;
      return;
    } catch (e) {
      if (!h.length) return;
      h = h.slice(1);
    }
  }
}
/* Clôture markdown plus longue que toute suite de backticks du code (4 minimum) */
function fenceFor(code) {
  const runs = code.match(/`+/g) || [];
  return '`'.repeat(Math.max(4, runs.reduce((m, r) => Math.max(m, r.length), 0) + 1));
}
/* Garde les blocs de plus haut niveau (retire ceux déjà contenus dans un autre), dans l'ordre du document */
function topBlocks(list) {
  return list
    .filter(b => !list.some(o => o !== b && o.outerStart <= b.outerStart && b.outerEnd <= o.outerEnd))
    .sort((a, b) => a.outerStart - b.outerStart);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- Notifications flottantes ---------- */
function dismiss(el) {
  if (!el || !el.parentNode) return;
  clearTimeout(el._t);
  el.classList.remove('in');
  setTimeout(() => el.remove(), 200);
}

function dismissKey(key) {
  const el = $('notifs').querySelector('[data-key="' + key + '"]');
  if (el) dismiss(el);
}

/* o : { kind: ok|warn|err, ms (0 = reste affichée), key, actions: [{label, fn}] } */
function notify(msg, o) {
  o = o || {};
  const box = $('notifs');
  let el = o.key ? box.querySelector('[data-key="' + o.key + '"]') : null;
  if (!el) {
    el = document.createElement('div');
    if (o.key) el.dataset.key = o.key;
    box.prepend(el);
  }
  el.className = 'notif ' + (o.kind || '');
  el.innerHTML = '<div class="nmsg"></div><div class="nact"></div><button class="nx" aria-label="Fermer">×</button>';
  el.querySelector('.nmsg').textContent = msg;
  const act = el.querySelector('.nact');
  (o.actions || []).forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.label;
    b.onclick = () => { dismiss(el); a.fn(); };
    act.appendChild(b);
  });
  el.querySelector('.nx').onclick = () => dismiss(el);
  clearTimeout(el._t);
  let ms = o.ms !== undefined ? o.ms : (o.kind === 'err' || o.kind === 'warn' ? 5200 : 2600);
  /* Test en plein écran : les notifications sans problème disparaissent vite */
  if (o.kind !== 'err' && o.kind !== 'warn' && $('tdlg').classList.contains('fullscreen')) ms = 1500;
  if (ms) el._t = setTimeout(() => dismiss(el), ms);
  while (box.children.length > 3) box.lastChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  return el;
}

/* ---------- Presse-papiers ---------- */
async function copyText(text, okMsg) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { }
    ta.remove();
    if (!ok) { notify('Copie impossible (autorisez le presse-papiers)', { kind: 'err' }); return; }
  }
  notify(okMsg || 'Copié ✓', { kind: 'ok' });
}

async function readClip() {
  try {
    const t = await navigator.clipboard.readText();
    if (!t || !t.trim()) { notify('Presse-papiers vide', { kind: 'err' }); return null; }
    return t;
  } catch (e) {
    notify('Collage bloqué : autorisez le presse-papiers', { kind: 'err' });
    return null;
  }
}

/* ---------- Persistance et historique ---------- */
function save() {
  hist = hist.slice(-MAX_HIST);
  const data = { text: $('src').value, level: $('level').value };
  if (!idbOK) { saveLegacy(data); return; }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) { /* quota */ }
  const sig = histSig();
  if (sig === lastHistSig) return;
  lastHistSig = sig;
  idbSet('hist', hist).catch(() => { idbOK = false; saveLegacy(data); });
}

function pushHistory(label) {
  const cur = $('src').value;
  if (!cur.trim()) return;
  if (hist.length && hist[hist.length - 1].text === cur) return;
  hist.push({ t: Date.now(), label, text: cur });
  if (hist.length > MAX_HIST) hist.shift();
}

function setText(v) {
  $('src').value = v;
  refresh();
  save();
}

function undoLast() {
  const h = hist[hist.length - 1];
  if (!h) { notify('Rien à annuler', { kind: 'err' }); return; }
  hist.pop();
  setText(h.text);
  $('result').innerHTML = '';
  notify('↶ Version précédente restaurée', { kind: 'ok', ms: 8000, actions: [{ label: 'Synchroniser l\'IA', fn: copyChanged }] });
}

/* ---------- Diff ---------- */
function renderDiff(a, b) {
  const d = diffLines(a, b), keep = new Array(d.length).fill(false);
  d.forEach((x, i) => { if (x.t !== '=') for (let k = i - 2; k <= i + 2; k++) if (k >= 0 && k < d.length) keep[k] = true; });
  let out = '', gap = false, shown = 0;
  for (let i = 0; i < d.length; i++) {
    if (!keep[i]) { gap = true; continue; }
    if (gap) { out += '<div class="d-gap">⋯</div>'; gap = false; }
    if (++shown > 500) { out += '<div class="d-gap">… (tronqué)</div>'; break; }
    const cls = d[i].t === '+' ? 'add' : d[i].t === '-' ? 'del' : 'eq';
    out += '<div class="d-' + cls + '">' + (d[i].t === '=' ? ' ' : d[i].t) + ' ' + esc(d[i].l) + '</div>';
  }
  return '<div class="diff">' + out + '</div>';
}

/* ---------- Messages prêts à renvoyer à l'IA ---------- */
const REMIND_TEXT = 'Rappel : réponds uniquement avec les blocs modifiés (même format #BLOC/#FIN, blocs complets, noms inchangés), dans un seul bloc de code. Ne change rien d\'autre que ce que je demande.\n\nMa demande : ';

function fixMessage(bad) {
  const lines = bad.map(l => l.glob ? '- ' + l.warn + '.' : l.ok ? '- Le bloc « ' + l.name + ' » semble invalide : ' + l.warn + '.' : '- ' + l.msg + '.');
  const miss = bad.some(l => !l.ok);
  return 'Il y a un souci avec ta dernière réponse :\n' + lines.join('\n') + '\n\n' +
    (miss ? 'Utilise exactement les noms de blocs du code balisé que je t\'ai donné. Voici l\'index actuel :\n' + buildIndex($('src').value) + '\n\n' : '') +
    'Renvoie uniquement le(s) bloc(s) corrigé(s), complet(s), avec les mêmes marqueurs #BLOC/#FIN, dans un seul bloc de code. Ne change rien d\'autre.';
}

/* ---------- Appliquer la réponse de l'IA ---------- */
function runResponse(apply) {
  const resp = $('resp').value;
  const box = $('result');
  const details = { label: 'Détails', fn: () => openAdv('acc-resp') };
  if (!resp.trim()) { notify('Collez d\'abord la réponse de l\'IA', { kind: 'err' }); return; }
  if (!/#(BLOC|APRES|AVANT|SUPPRIMER):/.test(resp)) {
    box.innerHTML = '<div class="note err">Aucun marqueur trouvé. La réponse doit contenir <code>/*\u0023BLOC:nom*/ … /*\u0023FIN:nom*/</code>. Pour remplacer un bloc avec du code brut, utilisez « Remplacer… » dans Avancé › Blocs.</div>';
    notify('Aucun marqueur #BLOC dans la réponse', { kind: 'err', ms: 0, actions: [details] });
    return;
  }
  const cur = $('src').value;
  if (!parseMarks(cur).blocks.length) { notify('Code non balisé : touchez « Analyser »', { kind: 'err' }); return; }
  const pr = parseResponse(resp);
  const res = applyOps(cur, pr.ops);
  const okN = res.log.filter(l => l.ok).length, koN = res.log.length - okN;
  const bad = res.log.filter(l => !l.ok || l.warn);
  if (okN) {
    /* Vérification globale : on ne signale que les problèmes nouveaux */
    const before = checkGlobal(cur);
    checkGlobal(res.text).filter(g => !before.includes(g))
      .forEach(g => bad.push({ ok: true, glob: true, name: '(global)', msg: g, warn: g }));
  }
  const fix = { label: '📨 Correction IA', fn: () => copyText(fixMessage(bad), 'Message copié — collez-le à l\'IA ✓') };

  let html = '';
  if (pr.errors.length) html += '<div class="note err">' + esc(pr.errors.join(' · ')) + '</div>';
  html += res.log.map(l => {
    const body = l.ok && (l.oldText || l.newText) ? renderDiff(l.oldText || '', l.newText || '') : '';
    return '<details class="' + (l.ok ? '' : 'bad') + '"' + (l.ok && res.log.length <= 3 ? ' open' : '') + '><summary>' + (l.ok ? '✓ ' : '✗ ') + esc(l.msg) +
      (l.warn ? '<span class="w">⚠ ' + esc(l.warn) + '</span>' : '') + '</summary>' + body + '</details>';
  }).join('');
  bad.filter(l => l.glob).forEach(l => { html += '<div class="note warn">⚠ ' + esc(l.warn) + '</div>'; });
  box.innerHTML = html;

  if (!apply) {
    notify('Aperçu : ' + okN + ' OK' + (koN ? ' · ' + koN + ' erreur(s)' : '') + ' — rien n\'est modifié',
      { kind: koN ? 'warn' : 'ok', ms: 0, actions: bad.length ? [details, fix] : [details] });
    return;
  }
  if (!okN) {
    notify('Rien n\'a été appliqué : ' + (res.log[0] ? res.log[0].msg : 'réponse vide'), { kind: 'err', ms: 0, actions: [details, fix] });
    return;
  }
  pushHistory('Avant application (' + okN + ' bloc' + (okN > 1 ? 's' : '') + ')');
  setText(res.text);
  snapApply(cur, res.text, res.log.filter(l => l.ok).map(l => l.name));
  const acts = [{ label: '↶ Annuler', fn: undoLast }, details];
  if (bad.length) acts.push(fix);
  const after = parseMarks(res.text).errors;
  notify('✓ ' + okN + ' bloc' + (okN > 1 ? 's' : '') + ' appliqué' + (okN > 1 ? 's' : '') +
    (bad.length ? ' · ' + bad.length + ' à vérifier' : '') + (after.length ? ' · marqueurs incohérents' : ''),
    { kind: bad.length || after.length ? 'warn' : 'ok', ms: bad.length || after.length ? 0 : 8000, key: 'apply', actions: acts });
  if ($('autotest').checked) runTest(true);
}

function copyAllForAI() {

  const head = PROMPT_TEXT.replace(/\n\nJe vais maintenant[\s\S]*$/, '');

}
/* Colle la demande de l'IA (qui cite des noms de blocs) et copie ces blocs prêts à renvoyer */
async function copyRequested() {
  if (!parseMarks($('src').value).blocks.length) { notify('Code non balisé : touchez « Analyser »', { kind: 'err' }); return; }
  const t = await readClip();
  if (t === null) return;
  const src = $('src').value;
  const { blocks } = parseMarks(src);
  let work = t;
  const hit = [];
  blocks.slice().sort((a, b) => b.name.length - a.name.length).forEach(b => {
    let i = work.indexOf(b.name);
    if (i < 0) return;
    hit.push(b);
    while (i >= 0) {
      work = work.slice(0, i) + ' '.repeat(b.name.length) + work.slice(i + b.name.length);
      i = work.indexOf(b.name);
    }
  });
  const list = topBlocks(hit);
  if (!list.length) { notify('Aucun nom de bloc reconnu dans le texte collé', { kind: 'err' }); return; }
  const code = list.map(b => src.slice(b.outerStart, b.outerEnd)).join('').replace(/\n$/, '');
  const f = fenceFor(code);
  copyText('Voici les blocs demandés :\n\n' + f + 'html\n' + code + '\n' + f,
    list.length + ' bloc' + (list.length > 1 ? 's' : '') + ' copié' + (list.length > 1 ? 's' : '') + ' ✓');
}
/* Envoi partiel : prompt + index complet + seulement les blocs cochés */
function copyPicked() {
  const src = $('src').value;

  if (!blocks.length) { notify('Code non balisé : touchez « Analyser »', { kind: 'err' }); return; }
  const list = topBlocks(blocks.filter(b => picked.has(b.name)));
  if (!list.length) { notify('Cochez d\'abord des blocs', { kind: 'err' }); return; }
  const head = PROMPT_TEXT.replace(/\n\nJe vais maintenant[\s\S]*$/, '');
  const code = list.map(b => src.slice(b.outerStart, b.outerEnd)).join('').replace(/\n$/, '');
  const f = fenceFor(code);
  copyText(head + '\n\nVoici l\'index complet des blocs, puis seulement les blocs utiles à ma demande. Si un autre bloc t\'est nécessaire, demande-le-moi par son nom. Réponds simplement « Prêt », puis attends ma demande.\n\n' +
    buildIndex(src) + '\n\n' + f + 'html\n' + code + '\n' + f,

/* Resynchronise l'IA : renvoie uniquement les blocs qui ont changé depuis ce qu'elle connaît */
function copyChanged() {
  const src = $('src').value;
  if (!parseMarks(src).blocks.length) { notify('Code non balisé : touchez « Analyser »', { kind: 'err' }); return; }
  if (!Object.keys(aiSnap).length) { notify('Aucun envoi enregistré : envoyez d\'abord le code (« Analyser » ou « Copier balisé »)', { kind: 'warn' }); return; }
  const { changed, gone } = changedBlocks(src);
  const list = topBlocks(changed);
  if (!list.length && !gone.length) { notify('L\'IA est à jour ✓', { kind: 'ok' }); return; }
  let msg = 'Mise à jour du code : ces blocs ont changé de mon côté. Leur version ci-dessous REMPLACE celle que tu connais : pars de celle-ci pour la suite. Réponds simplement « Prêt ».';
  if (gone.length) msg += '\n\nBlocs qui n\'existent plus : ' + gone.join(', ') + '.';
  if (list.length) {
    const code = list.map(b => src.slice(b.outerStart, b.outerEnd)).join('').replace(/\n$/, '');
    const f = fenceFor(code);
    msg += '\n\n' + f + 'html\n' + code + '\n' + f;
  }
  snapMark(src, list.map(b => b.name));
  gone.forEach(n => delete aiSnap[n]);
  saveSnap();
  copyText(msg, 'Mise à jour copiée ✓ — collez-la à l\'IA');
}

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/html;charset=utf-8' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
