  'window.addEventListener("unhandledrejection",function(e){var r=e.reason;P({m:String(r&&r.message?r.message:r),l:0})});' +
  'var ce=console.error;console.error=function(){P({m:Array.prototype.map.call(arguments,function(a){return a&&a.message?a.message:String(a)}).join(" "),l:0});ce.apply(console,arguments)}})();<\/script>';

function blockAtLine(text, line) {
  let off = 0;
  for (let i = 1; i < line; i++) { off = text.indexOf('\n', off) + 1; if (off === 0) return ''; }
  let best = null;
  for (const b of parseMarks(text).blocks)
    if (b.outerStart <= off && off < b.outerEnd && (!best || b.outerStart >= best.outerStart)) best = b;
  return best ? best.name : '';
}

function showTest(done) {
  $('tstatus').innerHTML = testErrors.length
    ? '<b style="color:var(--err)">' + testErrors.length + ' erreur(s) détectée(s)</b>'
    : done ? '<b style="color:var(--ok)">✓ Aucune erreur détectée au chargement (4 s).</b>' : 'Test en cours…';
  $('terrs').innerHTML = testErrors.map(o => '<div class="note err">' + esc(o.m) + (o.l ? ' — ligne ' + o.l : '') +
    (o.block ? ' · bloc <b>' + esc(o.block) + '</b>' : '') + '</div>').join('');
  $('t-copy').style.display = testErrors.length ? '' : 'none';
}

function testMessage() {
  const list = testErrors.slice(0, 3).map(o => '- « ' + o.m + ' »' + (o.l ? ' (ligne ' + o.l + ')' : '') + (o.block ? ', dans le bloc ' + o.block : '')).join('\n');
  return 'En lançant l\'appli après ta dernière modification, j\'obtiens :\n' + list +
    '\n\nCorrige le problème en renvoyant uniquement les blocs modifiés, complets, avec les mêmes marqueurs #BLOC/#FIN, dans un seul bloc de code. Ne change rien d\'autre.';
}

function stopTest() {
  clearTimeout(runTest._t);
  if (testListener) window.removeEventListener('message', testListener);
  testListener = null;
  $('tframe').srcdoc = '';
}

function runTest(auto) {
  const text = $('src').value;
  if (!text.trim()) { notify('Aucun code à tester', { kind: 'err' }); return; }
  stopTest();
  testErrors = [];
  showTest(false);
  openOv('tdlg');
  /* Aperçu automatique activé : test en plein écran sans bordure */
  const imm = $('autotest').checked;
  $('tdlg').classList.toggle('immersive', imm);
  if (imm) $('tdlg').classList.add('fullscreen');
  $('t-fs').innerHTML = '<svg class="ic"><use href="#' + ($('tdlg').classList.contains('fullscreen') ? 'i-x' : 'i-maximize') + '"/></svg>';
  /* Plein écran : les notifications de succès déjà affichées disparaissent vite */
  if ($('tdlg').classList.contains('fullscreen')) {
    document.querySelectorAll('#notifs .notif.ok').forEach(n => { clearTimeout(n._t); n._t = setTimeout(() => dismiss(n), 1500); });
  }
  $('tdlg').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const frame = $('tframe');
  testListener = ev => {
    if (ev.source !== frame.contentWindow || !ev.data || !ev.data.blocsProbe) return;
    const o = ev.data.blocsProbe;
    if (/service ?worker/i.test(o.m)) return;
    if (testErrors.some(x => x.m === o.m && x.l === o.l)) return;
    o.block = o.l ? blockAtLine(text, o.l) : '';
    testErrors.push(o);
    showTest(false);
  };
  window.addEventListener('message', testListener);
  const m = /<head[^>]*>/i.exec(text);
  frame.srcdoc = m ? text.slice(0, m.index + m[0].length) + PROBE + text.slice(m.index + m[0].length) : PROBE + text;
  runTest._t = setTimeout(() => {
    showTest(true);
    if ((auto === true || imm) && testErrors.length) {
      notify(testErrors.length + ' erreur(s) au test après application', {
        kind: 'err', ms: 0, key: 'autotest',
        actions: [
          { label: '↶ Annuler', fn: undoLast },
          { label: '📨 Correction IA', fn: () => copyText(testMessage(), 'Message copié ✓ — collez-le à l\'IA') }
        ]
      });
    }
  }, 4000);
}

/* ---------- Son discret au toucher ---------- */
let audioCtx = null, soundOn = true;
try { soundOn = localStorage.getItem('blocs.sound') !== '0'; } catch (e) { /* stockage indisponible */ }

function tick(strong) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(strong ? 900 : 640, t);
    o.frequency.exponentialRampToValueAtTime(strong ? 540 : 400, t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.075);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + 0.09);
  } catch (e) { /* audio indisponible */ }
}

document.addEventListener('pointerdown', e => {
  const b = e.target.closest && e.target.closest('button, summary');
  if (b && !b.disabled) tick(b.classList.contains('hero'));
}, true);

/* ---------- Initialisation ---------- */
function init() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s) {
      $('src').value = s.text || '';
      hist = Array.isArray(s.hist) ? s.hist : [];
      if (s.level) $('level').value = s.level;
    }
  } catch (e) { /* stockage indisponible */ }

  /* écran principal */
  let tm;
  $('src').addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { refresh(); save(); }, 400); });
  $('level').addEventListener('change', save);
  
  /* Bouton unique : Analyser (Coller -> Baliser -> Copier IA), puis Coller & appliquer */
  $('b-main').onclick = async () => {
    if (parseMarks($('src').value).blocks.length) { pasteAndApply(); return; }
    const t = await readClip();
    if (t === null) return;
    pushHistory('Avant analyse globale unique');
    setText(t);
    if (!analyseNow(true)) return;
    copyAllForAI();
  };

  $('b-test').onclick = runTest;
  $('b-copy-clean').onclick = () => copyText(stripMarks($('src').value), 'Code final copié ✓');
  $('b-clear').onclick = clearCode;
  $('b-undo-top').onclick = undoLast;
  $('b-adv').onclick = () => openAdv();

  /* feuilles */
  $('adv-close').onclick = () => closeOv('adv');
  $('dlg-x').onclick = () => closeOv('dlg');
  $('t-x').onclick = () => { $('tdlg').classList.remove('fullscreen'); closeOv('tdlg'); };
  $('t-fs').onclick = () => {
    const pane = $('tdlg');
    pane.classList.toggle('fullscreen');
    const isFs = pane.classList.contains('fullscreen');
    $('t-fs').innerHTML = isFs ? '<svg class="ic"><use href="#i-x"/></svg>' : '<svg class="ic"><use href="#i-maximize"/></svg>';
  };

  document.querySelectorAll('.ov').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) { $('tdlg').classList.remove('fullscreen'); closeOv(ov.id); } }));
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (isOpen('tdlg') && $('tdlg').classList.contains('fullscreen')) {
      $('tdlg').classList.remove('fullscreen');
      $('t-fs').innerHTML = '<svg class="ic"><use href="#i-maximize"/></svg>';
      return;
    }
    for (const id of ['tdlg', 'dlg', 'adv']) if (isOpen(id)) { closeOv(id); break; }
  });

  /* Avancé › Réponse de l'IA */
  $('b-rpaste').onclick = async () => { const t = await readClip(); if (t !== null) { $('resp').value = t; notify('Collé ✓', { kind: 'ok' }); } };
  $('b-preview').onclick = () => runResponse(false);
  $('b-apply').onclick = () => runResponse(true);

  /* Avancé › Blocs, Historique */
  $('q').addEventListener('input', () => renderBlocks());
  $('subs').addEventListener('change', () => renderBlocks());
  $('blist').addEventListener('click', e => {
    const btn = e.target.closest('button[data-a]');
    if (!btn) return;
    const name = btn.parentElement.dataset.n, a = btn.dataset.a;
    if (a === 'copy') {
      const { blocks } = parseMarks($('src').value), hit = findBlock(blocks, name);
      if (hit) copyText($('src').value.slice(hit.block.outerStart, hit.block.outerEnd), 'Bloc copié ✓');
    } else if (a === 'view') openBlockDlg('view', name);
    else if (a === 'rep') openBlockDlg('rep', name);
    else if (a === 'goto') gotoBlock(name);
  });
  $('blist').addEventListener('change', e => {
    const c = e.target.closest('input[data-p]');
    if (!c) return;
    if (c.checked) picked.add(c.dataset.p); else picked.delete(c.dataset.p);
  });
  $('b-send-sel').onclick = copyPicked;
  $('b-unpick').onclick = () => { picked.clear(); renderBlocks(); };
  $('hlist').addEventListener('click', e => {
    const btn = e.target.closest('button[data-a]');
    if (!btn) return;
    const h = hist[+btn.parentElement.dataset.i];
    if (!h) return;
    if (btn.dataset.a === 'hcopy') copyText(h.text, 'Version copiée ✓');
    else { pushHistory('Avant restauration'); setText(h.text); notify('Version restaurée ✓', { kind: 'ok' }); }
  });

  /* Avancé › Outils */
  $('snd').checked = soundOn;
  $('snd').onchange = e => { soundOn = e.target.checked; try { localStorage.setItem('blocs.sound', soundOn ? '1' : '0'); } catch (_) { } if (soundOn) tick(false); };
  try { $('autotest').checked = localStorage.getItem('blocs.autotest') === '1'; } catch (_) { }
  $('autotest').onchange = e => { try { localStorage.setItem('blocs.autotest', e.target.checked ? '1' : '0'); } catch (_) { } };
  $('b-prompt').onclick = () => copyText(PROMPT_TEXT, 'Prompt copié ✓');
  $('b-remind').onclick = () => copyText(REMIND_TEXT, 'Rappel copié ✓');
  $('b-index').onclick = () => copyText(buildIndex($('src').value), 'Index copié ✓');
  $('b-copy-marked').onclick = () => copyText($('src').value, 'Code balisé copié ✓');
  $('b-need').onclick = copyRequested;
  $('b-strip').onclick = () => { pushHistory('Avant retrait des marqueurs'); setText(stripMarks($('src').value)); notify('Marqueurs retirés', { kind: 'ok', actions: [{ label: '↶ Annuler', fn: undoLast }] }); };
  $('b-dl-clean').onclick = () => download('projet.html', stripMarks($('src').value));
  $('b-dl-marked').onclick = () => download('projet.balise.html', $('src').value);
  $('b-open').onclick = () => $('file').click();
  $('file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { pushHistory('Avant ouverture de fichier'); setText(String(r.result)); notify('Fichier chargé : ' + f.name, { kind: 'ok' }); };
    r.readAsText(f);
    e.target.value = '';
  };

  /* dialogue bloc, test */
  $('dlg-copy').onclick = () => copyText($('dlg-text').value);
  $('dlg-ok').onclick = dlgReplace;
  $('t-rerun').onclick = runTest;
  $('t-copy').onclick = () => copyText(testMessage(), 'Message copié ✓ — collez-le à l\'IA');

  /* historique : IndexedDB, fusionné avec l'ancien historique localStorage éventuel */
  idbGet('hist').then(h => {
    const old = Array.isArray(h) ? h : [];
    const cur = hist.filter(x => !old.some(y => y.t === x.t));
    hist = old.concat(cur).sort((a, b) => a.t - b.t).slice(-MAX_HIST);
    lastHistSig = '';
    refresh();
    save();
  }).catch(() => { idbOK = false; });

  refresh();
}
/* ---------- Tooltips sur les boutons-icônes (ergonomie souris) ---------- */

    'b-adv': 'Panneau Avancé',

    'b-main': 'Analyser ou appliquer la réponse (Ctrl+Entrée)',

    't-x': 'Fermer le test',

/* ---------- Sidebar desktop : recherche, actions, synchronisation des cases ---------- */
function wireSidebar() {
  addTooltips();
  const qs = $('q-side');
  if (!qs) return;
  qs.addEventListener('input', () => renderBlocks());
  $('subs-side').addEventListener('change', () => renderBlocks());
  $('blist-side').addEventListener('click', e => {
    const btn = e.target.closest('button[data-a]');
    if (!btn) return;
    const name = btn.parentElement.dataset.n, a = btn.dataset.a;
    if (a === 'copy') {
      const { blocks } = parseMarks($('src').value), hit = findBlock(blocks, name);
      if (hit) copyText($('src').value.slice(hit.block.outerStart, hit.block.outerEnd), 'Bloc copié ✓');
    } else if (a === 'view') openBlockDlg('view', name);
    else if (a === 'rep') openBlockDlg('rep', name);
    else if (a === 'goto') gotoBlock(name);
  });
  $('b-send-sel-side').onclick = copyPicked;
  $('b-unpick-side').onclick = () => { picked.clear(); renderBlocks(); };
  /* Sync des cases à cocher entre les deux conteneurs (#blist et #blist-side) */
  document.addEventListener('change', e => {
    const c = e.target && e.target.closest && e.target.closest('input[data-p]');
    if (!c) return;
    if (c.checked) picked.add(c.dataset.p); else picked.delete(c.dataset.p);
    document.querySelectorAll('input[data-p]').forEach(x => {
      if (x !== c && x.dataset.p === c.dataset.p) x.checked = c.checked;
    });
  });
}

init();
wireSidebar();
/* ---------- Raccourcis clavier globaux ---------- */
document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 'Enter') {
    e.preventDefault();
    $('b-main').click();
    return;
  }
  if (mod && (e.key === 's' || e.key === 'S')) {
    e.preventDefault();
    if (e.shiftKey) $('b-copy-marked').click();
    else $('b-dl-clean').click();
    return;
  }
  const ae = document.activeElement;
  const tag = (ae && ae.tagName) || '';
  const inField = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (ae && ae.isContentEditable);
  /* Focus rapide sur la recherche de blocs */
  if (!mod && !inField && e.key === '/') {
    e.preventDefault();
    if (window.innerWidth >= 1024) {
      const qs = $('q-side');
      if (qs) qs.focus();
    } else {
      openAdv('acc-blocs');
      setTimeout(() => { const q = $('q'); if (q) q.focus(); }, 100);
    }
  }
});
/* Synchronisation de l'IA : bouton (Avancé › Outils) et mémorisation de l'envoi « Copier balisé » */
$('b-sync').onclick = copyChanged;
$('b-copy-marked').addEventListener('click', () => { const v = $('src').value; if (parseMarks(v).blocks.length) snapMark(v); });

$('b-test').addEventListener('click', () => {
  const v = $('src').value;
  if ($('copyfinal').checked && v.trim()) copyText(stripMarks(v), 'Code final copié ✓');
});
try { $('copyfinal').checked = localStorage.getItem('blocs.copyfinal') === '1'; } catch (_) { }
$('copyfinal').addEventListener('change', e => { try { localStorage.setItem('blocs.copyfinal', e.target.checked ? '1' : '0'); } catch (_) { } });
